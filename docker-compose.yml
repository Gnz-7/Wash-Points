services:
  postgres:
    image: postgres:16-alpine
    container_name: washpoints-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: washpoints
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d washpoints"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./SRC/BACKEND
      dockerfile: WashPoints.Api/Dockerfile
    container_name: washpoints-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=washpoints;Username=postgres;Password=postgres
      # Credenciales de Mercado Pago (slice-20): vacías por defecto (D-20.6) —
      # el despliegue es autónomo y el arranque nunca se bloquea. Completarlas
      # vía .env (ver .env.example) habilita la vinculación OAuth y el cobro.
      MercadoPago__ClientId: ${MERCADOPAGO_CLIENT_ID:-}
      MercadoPago__ClientSecret: ${MERCADOPAGO_CLIENT_SECRET:-}
      MercadoPago__RedirectUri: ${MERCADOPAGO_REDIRECT_URI:-http://localhost:8081/api/mercadopago/oauth/callback}
      MercadoPago__ClaveTokens: ${MERCADOPAGO_CLAVE_TOKENS:-}
      # Webhook (sección Pagos, D-20.5): el secreto firma el x-signature y la
      # URL es la que MP tiene registrada en la app (pública, nunca localhost).
      # El default del secreto es el de desarrollo para no romper el flujo local
      # ya documentado; con la clave real de MP, completarla en .env.
      Pagos__WebhookSecret: ${PAGOS_WEBHOOK_SECRET:-washpoints-webhook-secret-local}
      Pagos__UrlNotificacion: ${PAGOS_URL_NOTIFICACION:-}
      Comprobantes__ClaveCifrado: ${COMPROBANTES_CLAVE_CIFRADO:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./SRC/FRONTEND/wash_points_app
      dockerfile: Dockerfile
    container_name: washpoints-web
    restart: unless-stopped
    # La web (Flutter web + Nginx) queda en el mismo origen que la API vía el
    # proxy /api y /hubs de nginx.conf (D-20.9): Production no necesita CORS.
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  postgres_data: