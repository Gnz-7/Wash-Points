# Servidor de la web (slice-20 T-221, D-20.9): SPA Flutter web + proxy inverso
# a la API. La web queda en el mismo origen que la API, así que Production no
# necesita CORS (D-20.2) y el negotiate de SignalR viaja por el mismo host.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta de cliente cae en index.html (GoRouter resuelve).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de la API REST.
    location /api {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hub de SignalR (RB-2): necesita WebSocket con upgrade.
    location /hubs {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
